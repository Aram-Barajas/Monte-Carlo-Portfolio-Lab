name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check Python syntax
        run: python -m compileall -q backend tests

      - name: Run Python lint and correctness checks
        run: python -m ruff check --select E4,E7,E9,F63,F7,F82 backend tests

      - name: Run automated tests with coverage
        run: python -m pytest -q --cov=backend --cov-branch --cov-report=term-missing --cov-fail-under=85

      - name: Dependency audit (informational)
        continue-on-error: true
        run: python -m pip_audit
  frontend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check frontend syntax
        run: for file in frontend/*.js; do node --check "$file"; done

      - name: Run frontend tests
        run: node --test tests/test_*.cjs
